<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#000000">

  <title>KLEEPING</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }

    .brand {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
      color: #ff6f61;
    }

    .subtitle {
      margin-top: 10px;
      color: #999;
      font-size: 14px;
      letter-spacing: .3px;
    }
  </style>
</head>

<body>

  <main id="app">

    <section class="screen">
      <div class="brand">KLEEPING</div>
      <div class="subtitle">Tu nueva red social</div>
    </section>

  </main>

</body>
</html>
